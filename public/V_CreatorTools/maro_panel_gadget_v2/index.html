<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maro Hub V2</title><link rel="stylesheet" href="maro.css"><style>
.tabs{display:flex;gap:8px}.tabs button{background:#2a3140}.tabs button.active{background:#ff4d79}.screen[hidden]{display:none}.button-link{display:inline-block;text-decoration:none;border-radius:8px;padding:9px 14px;background:#343b4a;color:#fff;font-weight:700}.editor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.editor-grid .card{margin:0}.control-grid{display:grid;gap:10px;margin-top:14px}.control-panel{min-height:90px;background:#fff;color:#333;border:3px solid transparent;border-radius:10px;position:relative}.control-panel.open{background:#ff85a2;color:#fff;border-color:#ff4d79}.control-panel small{position:absolute;top:6px;left:8px;opacity:.6}.detail{white-space:pre-wrap;line-height:1.7}.screen-actions{position:sticky;bottom:0;background:#10131aee;padding:12px 0}.danger-note{color:#ff9aac}
</style></head><body>
<header><h1>Maro Hub V2</h1><div class="tabs" role="tablist"><button data-screen="hub">Hub</button><button data-screen="editor">Editor</button><button data-screen="control">Control</button></div><nav><a id="viewLink" href="maro_view.html" target="maroViewV2">Viewを開く</a></nav></header>
<main class="app">
<section id="screen-hub" class="screen"><section class="card"><h2 id="projectTitle">読み込み中…</h2><div class="row"><span id="mode" class="status"></span><span id="summary" class="muted"></span></div></section><section class="card"><h2>配信準備</h2><div class="row"><button data-go="control">操作画面へ</button><a id="viewLaunch" class="button-link" href="maro_view.html" target="maroViewV2">表示画面を開く</a><button id="reset" class="danger">進行状態を初期化</button></div></section><section class="card"><h2>企画データ</h2><p class="muted">企画内容と配信中の進行状態をまとめてバックアップできます。</p><div class="row"><button id="exportButton" class="secondary">JSONを書き出す</button><button id="importButton" class="secondary">JSONを読み込む</button><button id="restoreBundled" class="danger">同梱データを読み直す</button><input id="file" type="file" accept="application/json" hidden></div></section></section>
<section id="screen-editor" class="screen" hidden><section class="card"><div class="row"><label>企画名 <input id="title"></label><label>列 <input id="cols" type="number" min="1" max="10"></label><label>行 <input id="rows" type="number" min="1" max="10"></label><button id="applyGrid">構成を反映</button><span id="editorStatus" class="status"></span></div></section><div id="panels" class="editor-grid"></div><div class="screen-actions"><button id="save">すべて保存</button></div></section>
<section id="screen-control" class="screen" hidden><section class="card"><div class="row"><button data-go="hub" class="secondary">Hubへ戻る</button><button id="undo" class="secondary">Undo</button><button id="controlReset" class="danger">全初期化</button><button id="hideDetail" class="secondary">本文を閉じる</button><span id="controlStatus" class="status"></span></div><div id="controlGrid" class="control-grid"></div></section><section id="detailCard" class="card" hidden><h2 id="detailTitle"></h2><div id="detailText" class="detail"></div></section></section>
</main>
<script src="settings.js"></script><script src="data.js"></script><script src="legacy-bootstrap.js"></script><script src="../_vct_core/runtime/v1/vct-runtime.js"></script><script src="maro-schema.js"></script><script src="maro-client.js"></script><script>
(() => {
 const client=new MaroClient();let draft=null;let currentScreen='hub';
 const $=id=>document.getElementById(id);const withMode=url=>{const u=new URL(url,location.href);if(VCTRuntime.mode==='server')u.searchParams.set('vctMode','server');return u.href};
 viewLink.href=withMode('maro_view.html');viewLaunch.href=withMode('maro_view.html');
 function showScreen(name,{history=true}={}){if(!['hub','editor','control'].includes(name))name='hub';currentScreen=name;document.querySelectorAll('.screen').forEach(node=>node.hidden=node.id!==`screen-${name}`);document.querySelectorAll('[data-screen]').forEach(button=>button.classList.toggle('active',button.dataset.screen===name));if(history){const url=new URL(location.href);name==='hub'?url.searchParams.delete('screen'):url.searchParams.set('screen',name);window.history.replaceState(null,'',url)}if(name==='editor'&&client.state)drawEditor(client.state);if(name==='control'&&client.state)drawControl(client.state)}
 document.querySelectorAll('[data-screen],[data-go]').forEach(button=>button.addEventListener('click',()=>showScreen(button.dataset.screen||button.dataset.go)));
 function render(state){projectTitle.textContent=state.project.title;mode.textContent=VCTRuntime.mode.toUpperCase();summary.textContent=`${state.project.grid.cols}×${state.project.grid.rows} / 開封 ${state.runtime.openedPanelIds.length} / revision ${state.revision}`;controlStatus.textContent=`開封 ${state.runtime.openedPanelIds.length}`;if(currentScreen==='editor')drawEditor(state);if(currentScreen==='control')drawControl(state)}
 function drawEditor(state){draft=MaroSchema.normalizeState(state);title.value=draft.project.title;cols.value=draft.project.grid.cols;rows.value=draft.project.grid.rows;editorStatus.textContent=VCTRuntime.mode.toUpperCase();panels.replaceChildren(...draft.project.panels.map((panel,index)=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>Panel ${index+1}</h2><label class="field">未開封タイトル<input data-key="title"></label><label class="field">開封後テキスト<input data-key="phrase"></label><label class="field">本文<textarea data-key="content" rows="5"></textarea></label>`;card.querySelectorAll('[data-key]').forEach(input=>input.value=panel[input.dataset.key]);card.addEventListener('input',event=>{if(event.target.dataset.key)panel[event.target.dataset.key]=event.target.value});return card}))}
 function drawControl(state){const opened=new Set(state.runtime.openedPanelIds);controlGrid.style.gridTemplateColumns=`repeat(${state.project.grid.cols},1fr)`;controlGrid.replaceChildren(...state.project.panels.map((panel,index)=>{const button=document.createElement('button');button.className='control-panel';button.classList.toggle('open',opened.has(panel.id));button.dataset.id=panel.id;const number=document.createElement('small');number.textContent=String(index+1);const text=document.createElement('span');text.textContent=opened.has(panel.id)?panel.phrase:panel.title;button.append(number,text);return button}));const active=state.project.panels.find(panel=>panel.id===state.runtime.activePanelId);detailCard.hidden=!active;if(active){detailTitle.textContent=active.title;detailText.textContent=active.content}}
 applyGrid.onclick=()=>{draft.project.title=title.value;draft.project.grid={cols:Number(cols.value),rows:Number(rows.value)};draft=MaroSchema.normalizeState(draft);drawEditor(draft)};
 save.onclick=async()=>{draft.project.title=title.value;try{await client.replaceState(draft);editorStatus.textContent='保存しました'}catch(error){editorStatus.textContent=error.message}};
 controlGrid.onclick=async event=>{const panel=event.target.closest('[data-id]');if(!panel)return;const opened=client.state.runtime.openedPanelIds.includes(panel.dataset.id);await client.command(opened?'show-detail':'open',panel.dataset.id)};
 undo.onclick=()=>client.command('undo');controlReset.onclick=()=>client.command('reset');hideDetail.onclick=()=>client.command('hide-detail');reset.onclick=()=>client.command('reset');
 exportButton.onclick=()=>{const blob=new Blob([JSON.stringify(client.state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`maro-${client.state.project.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)};
 importButton.onclick=()=>file.click();file.onchange=async()=>{const selected=file.files[0];if(!selected)return;try{await client.replaceState(MaroSchema.normalizeState(JSON.parse(await selected.text())))}catch(error){alert(error.message)}file.value=''};
 restoreBundled.onclick=async()=>{if(!confirm('現在の企画データと進行状態を、同梱の settings.js / data.js で置き換えますか？'))return;try{await client.replaceState(MaroSchema.fromLegacy(CONFIG,MARO_DATA))}catch(error){alert(error.message)}};
 client.subscribe(render);client.initialize().then(()=>showScreen(new URL(location.href).searchParams.get('screen')||'hub',{history:false}));
})();
</script></body></html>
