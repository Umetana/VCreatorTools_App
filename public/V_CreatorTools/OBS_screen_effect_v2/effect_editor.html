<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エフェクト・リスト・エディター</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --panel-bg: #1a1a2e;
            --accent: #4ecca3;
            --accent-glow: rgba(78, 204, 163, 0.3);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ff6b6b;
            --warning: #ffcc00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', 'BIZ UDPGothic', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, border-color 0.2s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 10px 30px 0;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s;
            border-radius: 8px 8px 0 0;
            position: relative;
        }

        .tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(78, 204, 163, 0.1);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        main {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            position: relative;
        }

        .content-area {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .content-area.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }

        .file-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            filter: brightness(1.1);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: white;
        }

        input[type="file"] {
            display: none;
        }

        .effect-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .effect-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            transition: all 0.2s;
        }

        .effect-item:hover {
            border-color: var(--accent-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            box-sizing: border-box;
            font-family: monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .effect-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .import-area {
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: monospace;
            font-size: 0.85rem;
            margin-bottom: 10px;
            resize: vertical;
        }

        .footer-bar {
            background: var(--panel-bg);
            padding: 15px 30px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
        }

        .status-badge.changed {
            background: var(--warning);
            color: #000;
        }

        /* Tooltip style */
        .info-text {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Effect List Editor <small
                style="font-size: 0.7rem; color: var(--text-dim); font-weight: normal;">v1.0</small></h1>
        <div class="header-actions">
            <a class="back-link" href="config.html">← 設定画面へ戻る</a>
            <div id="file-status" class="status-badge">未読み込み</div>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('official')">公式エフェクト (effects_list.js)</button>
        <button class="tab-btn" onclick="switchTab('user')">サードパーティ製 (effects_user.js)</button>
    </div>

    <main>
        <!-- Official Tab -->
        <div id="tab-official" class="content-area active">
            <div class="card">
                <h2>既存ファイルのロード</h2>
                <div class="info-text">
                    [js/effects_list.js] を選択して読み込むか、「デフォルトを生成」で新規作成できます。
                </div>
                <div class="file-controls">
                    <button class="btn btn-secondary" onclick="document.getElementById('input-official').click()">
                        <span>📂</span> ファイルを開く
                    </button>
                    <input type="file" id="input-official" accept=".js" onchange="loadFile(this, 'official')">
                </div>
            </div>

            <div class="card">
                <h2>エフェクト一覧</h2>
                <div id="list-official" class="effect-list">
                    <!-- Dynamic Items -->
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">
                        ファイルを読み込んでください
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button class="btn btn-ghost" onclick="addItem('official')">➕ エフェクトを追加</button>
                </div>
            </div>
        </div>

        <!-- User/Third Party Tab -->
        <div id="tab-user" class="content-area">
            <div class="card">
                <h2>既存ファイルのロード / 外部インポート</h2>
                <div class="info-text">
                    [js/effects_user.js] を選択して読み込みます。
                </div>
                <div class="file-controls">
                    <button class="btn btn-secondary" onclick="document.getElementById('input-user').click()">
                        <span>📂</span> ファイルを開く
                    </button>
                    <input type="file" id="input-user" accept=".js" onchange="loadFile(this, 'user')">
                </div>

                <div class="import-area">
                    <div class="info-text" style="color: var(--accent);">
                        ✨ 追加したいサードパーティ製エフェクトのJS（1行など）をここに貼り付けて追加できます：
                    </div>
                    <textarea id="import-snippet" placeholder='{ "id": "fancy_effect", "name": "新・おしゃれ演出" }'></textarea>
                    <button class="btn btn-primary" onclick="importFromSnippet()">追加する</button>
                </div>
            </div>

            <div class="card">
                <h2>サードパーティ・エフェクト一覧</h2>
                <div id="list-user" class="effect-list">
                    <!-- Dynamic Items -->
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">
                        ファイルを読み込むか、スニペットを追加してください
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button class="btn btn-ghost" onclick="addItem('user')">➕ 新規追加</button>
                </div>
            </div>
        </div>
    </main>

    <div class="footer-bar">
        <button class="btn btn-secondary" onclick="previewResult()">プレビュー</button>
        <button class="btn btn-primary" id="btn-download" onclick="exportFile()">
            <span>💾</span> 編集したJSをダウンロード
        </button>
    </div>

    <script>
const urlParams = new URLSearchParams(window.location.search);
const isOfficialMode = urlParams.has('dev');

let currentTab = isOfficialMode ? 'official' : 'user';
let dataMap = {
    official: [],
    user: []
};
let isModified = false;

window.onload = function () {
    const officialTabBtn = document.querySelector('.tab-btn[onclick*="official"]');

    if (!isOfficialMode && officialTabBtn) {
        officialTabBtn.style.display = 'none';
        switchTab('user');
    } else {
        switchTab('official');
    }
    updateBadge();
};

function switchTab(tab) {
    if (tab === 'official' && !isOfficialMode) return;

    currentTab = tab;

    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
        const onclickValue = b.getAttribute('onclick') || '';
        if (onclickValue.includes(`'${tab}'`)) {
            b.classList.add('active');
        }
    });

    document.querySelectorAll('.content-area').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    updateBadge();
}

        function parseStrictJSON(text) {
            return JSON.parse(text);
        }

        function updateBadge() {
            const badge = document.getElementById('file-status');
            const list = dataMap[currentTab];
            if (list.length === 0) {
                badge.innerText = '未読み込み';
                badge.className = 'status-badge';
            } else {
                badge.innerText = `${list.length} 件のエフェクト`;
                badge.className = isModified ? 'status-badge changed' : 'status-badge';
            }
        }

        function loadFile(input, target) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                parseJS(content, target);
            };
            reader.readAsText(file);
        }

        function parseJS(content, target) {
            try {
                // 非常に簡易的なパース： [...] の中身を取り出す
                // 実際にはもっと複雑なJSもあり得るが、指定の構成に特化
                const start = content.indexOf('[');
                const end = content.lastIndexOf(']');

                if (start === -1 || end === -1) {
                    throw new Error("配列が見つかりませんでした");
                }

                const arrayStr = content.substring(start, end + 1);
                const parsed = parseStrictJSON(arrayStr);

                if (Array.isArray(parsed)) {
                    dataMap[target] = parsed;
                    renderList(target);
                    updateBadge();
                }

            } catch (err) {
                console.error(err);
                alert("ファイルの解析に失敗しました。正しい構成か確認してください。");
            }
        }

        function renderList(target) {
            const container = document.getElementById(`list-${target}`);
            container.innerHTML = '';

            dataMap[target].forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'effect-item';

                const nameGroup = document.createElement('div');
                nameGroup.className = 'form-group';
                nameGroup.style.marginBottom = '8px';
                const nameLabel = document.createElement('label');
                nameLabel.textContent = 'Name (表示名)';
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = item.name || '';
                nameInput.onchange = function () {
                    updateItem(target, index, 'name', this.value);
                };
                nameGroup.appendChild(nameLabel);
                nameGroup.appendChild(nameInput);

                const idGroup = document.createElement('div');
                idGroup.className = 'form-group';
                const idLabel = document.createElement('label');
                idLabel.textContent = 'ID (内部ID)';
                const idInput = document.createElement('input');
                idInput.type = 'text';
                idInput.value = item.id || '';
                idInput.onchange = function () {
                    updateItem(target, index, 'id', this.value);
                };
                idGroup.appendChild(idLabel);
                idGroup.appendChild(idInput);

                const actions = document.createElement('div');
                actions.className = 'effect-actions';
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-ghost';
                removeBtn.style.padding = '4px 8px';
                removeBtn.style.fontSize = '0.7rem';
                removeBtn.style.borderColor = 'var(--danger)';
                removeBtn.style.color = 'var(--danger)';
                removeBtn.textContent = '削除';
                removeBtn.onclick = function () {
                    removeItem(target, index);
                };
                actions.appendChild(removeBtn);

                div.appendChild(nameGroup);
                div.appendChild(idGroup);
                div.appendChild(actions);
                container.appendChild(div);
            });

            if (dataMap[target].length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-dim);">エフェクトがありません</div>';
            }
        }

        function updateItem(target, index, key, value) {
            dataMap[target][index][key] = value;
            isModified = true;
            updateBadge();
        }

        function addItem(target) {
            dataMap[target].push({ id: "new_effect", name: "新しいエフェクト" });
            isModified = true;
            renderList(target);
            updateBadge();
        }

        function removeItem(target, index) {
            if (confirm("削除してもよろしいですか？")) {
                dataMap[target].splice(index, 1);
                isModified = true;
                renderList(target);
                updateBadge();
            }
        }

        function importFromSnippet() {
            const snippet = document.getElementById('import-snippet').value.trim();
            if (!snippet) return;

            try {
                const parsed = parseStrictJSON(snippet);

                if (Array.isArray(parsed)) {
                    dataMap.user = [...dataMap.user, ...parsed];
                } else if (typeof parsed === 'object') {
                    dataMap.user.push(parsed);
                } else {
                    throw new Error("無効な形式です");
                }

                document.getElementById('import-snippet').value = '';
                isModified = true;
                renderList('user');
                updateBadge();
                alert("追加しました！");

            } catch (err) {
                alert('スニペットの解析に失敗しました。JSON形式で入力してください。例: {"id":"...","name":"..."}');
            }
        }

        function generateJS(target) {
            const varName = target === 'official' ? 'OFFICIAL_EFFECTS' : 'USER_EFFECTS';
            const json = JSON.stringify(dataMap[target], null, 4);

            let header = target === 'official'
                ? 'const OFFICIAL_EFFECTS = '
                : '/**\n * ユーザー自作エフェクト登録用ファイル\n */\nconst USER_EFFECTS = ';

            const footer = `\n\nif (typeof module !== 'undefined' && module.exports) {\n    module.exports = ${varName};\n}`;

            return header + json + ';' + footer;
        }

        function exportFile() {
            if (dataMap[currentTab].length === 0) {
                alert("エフェクトがありません。");
                return;
            }

            const content = generateJS(currentTab);
            const filename = currentTab === 'official' ? 'effects_list.js' : 'effects_user.js';

            const blob = new Blob([content], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            isModified = false;
            updateBadge();
        }

        function previewResult() {
            const content = generateJS(currentTab);
            console.log(content);
            alert("コンソールに生成内容を出力しました。F12キーで確認できます。");
        }
    </script>
</body>

</html>
