<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Panel Counter V2</title>
  <style>
    :root { color-scheme: dark; --ui-h: 150px; }

    html, body { width:100%; height:100%; margin:0; padding:0; background:transparent; overflow:hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* 表示領域（パネル） */
    #stage{
      position:absolute;
      left:0; right:0; top:0;
      bottom: var(--ui-h); /* UI分だけ空ける */
      background: transparent;
    }
    #grid{
      position:absolute;
      inset:0;
      display:grid;
      gap: 2px;
      pointer-events:none;
    }
    .cell{
      background: rgba(0,0,0,0.92);
      border-radius: 0px;
      opacity: 1;
      transition: opacity 180ms linear;
    }
    .cell.open{ opacity: 0; }

    /* 下部UI */
    #ui{
      position:absolute;
      left:0; right:0; bottom:0;
      height: var(--ui-h);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(0,0,0,0.45);
      border-top: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      box-sizing:border-box;
    }

    #uiLeft, #uiRight{ display:flex; align-items:center; gap:10px; }
    #uiRight{ gap: 14px; }

    .btn{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.92);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
      user-select:none;
    }
    .btn:disabled{
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn.small{ padding: 6px 10px; font-weight:600; border-radius: 10px; }
    .btn.active{
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.35);
    }

    #countBox{
      min-width: 74px;
      text-align:center;
      font-weight:800;
      font-size: 18px;
      letter-spacing: 0.5px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.28);
    }

    #layoutBlock{ display:flex; flex-direction:column; gap:8px; }
    #layoutSwitch{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    #recommendText{
      font-size: 12px;
      opacity: 0.92;
      white-space: nowrap;
    }
    #recNote{
      margin-left: 8px;
      opacity: 0.75;
      font-size: 11px;
    }

    #status{
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:flex-end;
      font-size: 12px;
      opacity: 0.9;
      white-space: nowrap;
    }
    #syncBadge{
      font-weight: 750;
      opacity: 0.95;
    }
    #syncBadge.waiting{ opacity: 0.7; }
  </style>

  <!-- settings.js（存在すれば） -->
  <script src="./settings.js"></script>
</head>
<body>

  <div id="stage">
    <div id="grid"></div>
  </div>

  <div id="ui">
    <div id="uiLeft">
      <button class="btn" id="btnMinus" type="button">−</button>
      <div id="countBox" title="count" aria-label="count">0</div>
      <button class="btn" id="btnPlus" type="button">＋</button>
      <button class="btn" id="btnReset" type="button">RESET</button>
    </div>

    <div id="uiRight">
      <div id="layoutBlock">
        <div id="layoutSwitch" aria-label="Layout switch">
          <button class="btn small layout-btn active" data-layout="square" type="button">□ 正方形</button>
          <button class="btn small layout-btn" data-layout="wide" type="button">▭ 横長</button>
          <button class="btn small layout-btn" data-layout="tall" type="button">▮ 縦長</button>
        </div>
        <div id="recommendText">
          推奨OBSサイズ：<span id="recSize">930 × 1080</span>
          <span id="recNote">（表示 930 × 930 + 操作部 150）</span>
        </div>
      </div>

      <div id="status">
        <div id="syncBadge" class="waiting" style="display:none;">SYNC: (off)</div>
        <div>step: <span id="stepLabel">5</span> / open: <span id="openLabel">0</span></div>
        <div style="opacity:.75;">Open Panel Counter V2</div>
      </div>
    </div>
  </div>

<script src="../_vct_core/runtime/v1/vct-runtime.js"></script>
<script src="../_vct_core/gp-counter/v2/counter-core.js"></script>
<script src="../_vct_core/gp-counter/v2/counter-schema.js"></script>
<script src="../_vct_core/gp-counter/v2/counter-protocol.js"></script>
<script src="../_vct_core/gp-counter/v2/counter-store.js"></script>
<script src="../_vct_core/gp-counter/v2/counter-client.js"></script>
<script src="../_vct_core/gp-counter/v2/gp-counter-server.js"></script>
<script>
(() => {
  // -----------------------------
  // 設定（settings.js があれば window.PANEL_REVEAL_SETTINGS で上書き）
  // -----------------------------
  const DEFAULT_SETTINGS = {
    layout: "square",
    grid: { rows: 5, cols: 5, gap: 2 },
    panel: { color: "rgba(0,0,0,0.92)", borderRadius: 0, opacity: 1.0 },
    reveal: {
      step: 5,
      mode: "random",  // random | ordered | spiral | centerLast
      orderedDirection: "tlbr",
      seed: null
    },
    anim: { type: "fade", durationMs: 180 },
    persist: { progress: true, key: "vct:open-panel-counter:v2:progress" },

    // GP Multi Counter V2連動
    sync: {
      enabled: false,
      counterId: "counter1",
      lockUI: true
    },

    ui: { version: "v2" }
  };

  const SETTINGS = deepMerge(structuredClone(DEFAULT_SETTINGS), (window.PANEL_REVEAL_SETTINGS || {}));

  // UI高さ（settings_uiが計算で使う前提値。ここはCSSに合わせて固定）
  const UI_H = 150;

  // レイアウトプリセット（推奨サイズ表示用）
  const LAYOUT_PRESETS = {
    square: { label: "正方形", rows: 5, cols: 5, obsW: 930,  obsH: 1080, dispW: 930,  dispH: 930 },
    wide:   { label: "横長",   rows: 4, cols: 6, obsW: 1395, obsH: 1080, dispW: 1395, dispH: 930 },
    tall:   { label: "縦長",   rows: 6, cols: 4, obsW: 620,  obsH: 1080, dispW: 620,  dispH: 930 },
  };

  // -----------------------------
  // DOM
  // -----------------------------
  const els = {
    grid: document.getElementById("grid"),
    btnMinus: document.getElementById("btnMinus"),
    btnPlus: document.getElementById("btnPlus"),
    btnReset: document.getElementById("btnReset"),
    countBox: document.getElementById("countBox"),
    stepLabel: document.getElementById("stepLabel"),
    openLabel: document.getElementById("openLabel"),
    layoutSwitch: document.getElementById("layoutSwitch"),
    recSize: document.getElementById("recSize"),
    recNote: document.getElementById("recNote"),
    syncBadge: document.getElementById("syncBadge"),
  };

  // -----------------------------
  // 状態
  // -----------------------------
  let currentLayout = SETTINGS.layout || "square";
  let rows = SETTINGS.grid?.rows ?? 5;
  let cols = SETTINGS.grid?.cols ?? 5;
  let count = 0;

  // reveal order / cells
  let revealOrder = [];
  let cells = [];

  // GP Multi Counter V2 sync
  let syncId = null;
  let syncSeen = false;
  let counterClient = null;
  let serverClient = null;

  // seed（固定seedが無い時だけ localStorageに保持）
  let sessionSeed = loadSeed() ?? ((Math.random() * 0xFFFFFFFF) >>> 0);

  // -----------------------------
  // 初期化
  // -----------------------------
  loadProgress();
  applyLayout(currentLayout, true);     // UI＆grid構築（v0.2機能）
  initUIEvents();                       // 操作UI（v0.2機能）
  if (SETTINGS.sync?.enabled) initSync(); else setSyncBadge(false, "SYNC: (off)");
  applyAllPanels();
  updateUI();

  // -----------------------------
  // Functions
  // -----------------------------
  function deepMerge(base, patch) {
    if (!patch || typeof patch !== "object") return base;
    for (const [k, v] of Object.entries(patch)) {
      if (v && typeof v === "object" && !Array.isArray(v) && typeof base[k] === "object" && base[k] !== null) {
        base[k] = deepMerge(base[k], v);
      } else {
        base[k] = v;
      }
    }
    return base;
  }

  function clampInt(n, lo, hi) {
    n = Math.floor(Number(n));
    if (!Number.isFinite(n)) return lo;
    return Math.max(lo, Math.min(hi, n));
  }

  function seedStorageKey() {
    return `${SETTINGS.persist?.key || "open-panel-counter-progress"}:seed`;
  }
  function loadSeed() {
    try {
      const raw = localStorage.getItem(seedStorageKey());
      const n = Number(raw);
      return Number.isFinite(n) ? (n >>> 0) : null;
    } catch { return null; }
  }
  function saveSeed() {
    if (!SETTINGS.persist?.progress) return;
    try { localStorage.setItem(seedStorageKey(), String(sessionSeed >>> 0)); } catch {}
  }

  function loadProgress() {
    if (!SETTINGS.persist?.progress) return;
    try {
      const raw = localStorage.getItem(SETTINGS.persist.key);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (!SETTINGS.sync?.enabled && typeof obj?.count === "number") count = clampInt(obj.count, 0, 999999);
      if (typeof obj?.layout === "string" && LAYOUT_PRESETS[obj.layout]) currentLayout = obj.layout;
    } catch {}
  }
  function saveProgress() {
    if (!SETTINGS.persist?.progress) return;
    try {
      localStorage.setItem(SETTINGS.persist.key, JSON.stringify({ count, layout: currentLayout }));
    } catch {}
  }

  function effectiveSeed() {
    const s = SETTINGS.reveal?.seed;
    if (Number.isFinite(s)) return (Number(s) >>> 0);
    return (sessionSeed >>> 0);
  }

  function setSyncBadge(isOn, text, waiting=false) {
    els.syncBadge.style.display = isOn ? "" : "none";
    els.syncBadge.textContent = text;
    els.syncBadge.classList.toggle("waiting", !!waiting);
  }

  function initUIEvents() {
    els.btnPlus.addEventListener("click", () => setCount(count + 1));
    els.btnMinus.addEventListener("click", () => setCount(count - 1));
    els.btnReset.addEventListener("click", () => setCount(0, { force: true }));

    els.layoutSwitch.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-layout]");
      if (!btn) return;
      const key = btn.getAttribute("data-layout");
      if (!LAYOUT_PRESETS[key]) return;
      document.querySelectorAll(".layout-btn").forEach(b => b.classList.toggle("active", b === btn));
      applyLayout(key, false);
    });
  }

  // --- GP Multi Counter V2 Consumer ---
  async function initSync() {
    syncId = resolveCounterId();
    setSyncBadge(true, `${VCTRuntime.mode.toUpperCase()}: ${syncId} (waiting...)`, true);

    if (SETTINGS.sync?.lockUI) {
      els.btnPlus.disabled = true;
      els.btnMinus.disabled = true;
      els.btnReset.disabled = true;
    }

    const repository = new CounterStateRepository({ storageKey: CounterMessageProtocol.storageKeyForMode(VCTRuntime.mode) });
    counterClient = new CounterClient({ role: 'consumer', repository, canRespond: false });
    const applyState = state => {
      const me = state?.counters?.find(counter => counter.id === syncId);
      if (!me) return;
      syncSeen = true;
      setSyncBadge(true, `${VCTRuntime.mode.toUpperCase()}: ${syncId} (OK)`, false);
      setCount(clampInt(me.count, 0, 999999), { fromSync: true, force: true });
    };

    serverClient = GPCounterServer.createClient({ role: 'consumer', onState: applyState });
    const localState = repository.load([]);
    applyState(localState);
    if (serverClient.enabled) {
      try { await serverClient.initialize([]); }
      catch (error) {
        setSyncBadge(true, `SERVER: ${syncId} (cache)`, true);
        console.warn('GP Counter Server unavailable; local cache is active.', error);
      }
      return;
    }
    counterClient.subscribe(event => applyState(event.state));
    counterClient.start({ knownRevision: repository.getState().revision });
  }

  function resolveCounterId() {
    // URL指定を設定より優先
    const url = new URL(window.location.href);
    const qCounter = url.searchParams.get("counter");
    if (qCounter && /^\d+$/.test(qCounter)) return `counter${qCounter}`;
    const qId = url.searchParams.get("id");
    if (qId && /^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(qId)) return qId;
    const configured = String(SETTINGS.sync?.counterId || '');
    if (/^[A-Za-z][A-Za-z0-9_-]{0,63}$/.test(configured)) return configured;
    const file = (url.pathname || "").split("/").pop() || "";
    const m = file.match(/counter(\d+)/i);
    if (m) return `counter${m[1]}`;

    return "counter1";
  }

  // --- v0.2: Layout + Grid build ---
  function applyLayout(key, isInit) {
    currentLayout = key;
    const p = LAYOUT_PRESETS[key] || LAYOUT_PRESETS.square;

    rows = p.rows;
    cols = p.cols;

    els.recSize.textContent = `${p.obsW} × ${p.obsH}`;
    els.recNote.textContent = `（表示 ${p.dispW} × ${p.dispH} + 操作部 ${UI_H}）`;

    buildGrid(rows, cols);

    // 固定seedが無いときだけ、レイアウト変更ごとに “別の見え方” にする
    if (!Number.isFinite(SETTINGS.reveal?.seed)) {
      sessionSeed = (Math.random() * 0xFFFFFFFF) >>> 0;
      saveSeed();
    }

    revealOrder = buildRevealOrder(rows, cols, {
      mode: SETTINGS.reveal?.mode || "random",
      orderedDirection: SETTINGS.reveal?.orderedDirection || "tlbr",
      seed: effectiveSeed(),
    });

    applyAllPanels();
    updateUI();

    if (isInit) {
      document.querySelectorAll(".layout-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-layout") === key));
    }
    saveProgress();
  }

  function buildGrid(r, c) {
    const gap = Number(SETTINGS.grid?.gap ?? 2);
    const color = SETTINGS.panel?.color ?? "rgba(0,0,0,0.92)";
    const br = Number(SETTINGS.panel?.borderRadius ?? 0);

    els.grid.style.gridTemplateRows = `repeat(${r}, 1fr)`;
    els.grid.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    els.grid.style.gap = `${Number.isFinite(gap) ? gap : 2}px`;

    els.grid.innerHTML = "";
    cells = [];
    for (let i = 0; i < r * c; i++) {
      const d = document.createElement("div");
      d.className = "cell";
      d.style.background = color;
      d.style.borderRadius = `${Number.isFinite(br) ? br : 0}px`;
      d.style.transitionDuration = `${clampInt(SETTINGS.anim?.durationMs ?? 180, 0, 5000)}ms`;
      els.grid.appendChild(d);
      cells.push(d);
    }
  }

  function setCount(n, opts = {}) {
    const next = clampInt(n, 0, 999999);
    if (next === count && !opts.force) return;
    count = next;
    applyAllPanels();
    updateUI();
    saveProgress();
  }

  function openedCount() {
    const step = Math.max(1, clampInt(SETTINGS.reveal?.step ?? 5, 1, 999999));
    return Math.min(rows * cols, Math.floor(count / step));
  }

  function applyAllPanels() {
    const openN = openedCount();
    const openSet = new Set(revealOrder.slice(0, openN));
    for (let i = 0; i < cells.length; i++) {
      cells[i].classList.toggle("open", openSet.has(i));
    }
  }

  function updateUI() {
    const openN = openedCount();
    els.countBox.textContent = String(count);
    els.stepLabel.textContent = String(Math.max(1, clampInt(SETTINGS.reveal?.step ?? 5, 1, 999999)));
    els.openLabel.textContent = String(openN);

    if (SETTINGS.sync?.enabled && !syncSeen) {
      // waiting 表示のまま
    }
  }

  // -----------------------------
  // Reveal order generators
  // -----------------------------
  function buildRevealOrder(r, c, opt) {
    const mode = opt.mode || "random";
    if (mode === "ordered") return orderedOrder(r, c, opt.orderedDirection || "tlbr");
    if (mode === "spiral") return spiralOrder(r, c);
    if (mode === "centerLast") return centerLastOrder(r, c, opt.seed >>> 0);
    return randomOrder(r, c, opt.seed >>> 0);
  }

  function orderedOrder(r, c, dir) {
    const idx = [];
    for (let y=0; y<r; y++) for (let x=0; x<c; x++) idx.push(y*c+x);
    if (dir === "tlbr") return idx;
    return idx;
  }

  function spiralOrder(r, c) {
    const out = [];
    let top=0, left=0, bottom=r-1, right=c-1;
    while (top<=bottom && left<=right) {
      for (let x=left; x<=right; x++) out.push(top*c+x);
      top++;
      for (let y=top; y<=bottom; y++) out.push(y*c+right);
      right--;
      if (top<=bottom) {
        for (let x=right; x>=left; x--) out.push(bottom*c+x);
        bottom--;
      }
      if (left<=right) {
        for (let y=bottom; y>=top; y--) out.push(y*c+left);
        left++;
      }
    }
    return out;
  }

  function centerLastOrder(r, c, seed) {
    const cx=(c-1)/2, cy=(r-1)/2;
    const arr = [];
    for (let y=0; y<r; y++) for (let x=0; x<c; x++) {
      const i=y*c+x;
      const d = Math.hypot(x-cx, y-cy);
      arr.push({i, d});
    }
    arr.sort((a,b)=> b.d - a.d);
    const rng = mulberry32(seed);
    for (let i=0; i<arr.length-1; i++) {
      const j = i + Math.floor(rng()*Math.min(6, arr.length-i));
      const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr.map(x=>x.i);
  }

  function randomOrder(r, c, seed) {
    const n = r*c;
    const out = Array.from({length:n}, (_,i)=>i);
    const rng = mulberry32(seed);
    for (let i=n-1; i>0; i--) {
      const j = Math.floor(rng()*(i+1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function mulberry32(a) {
    return function() {
      let t = (a += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  }
})();
</script>
</body>
</html>
