<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GP MULTI COUNTER - Settings</title>
    <style>
        html, body { margin: 0; min-height: 100%; background: #2b2e3b; color: #efefef; font-family: Meiryo, sans-serif; }
        body { display: grid; place-items: center; }
        p { padding: 20px; text-align: center; }
        a { color: #7ab7ff; }
    </style>
</head>
<body>
    <p>統合設定画面を開いています。<br><a id="settings-link" href="control_setting.html">開かない場合はこちら</a></p>
    <script>
        const target = new URL('control_setting.html', window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash;
        document.getElementById('settings-link').href = target.href;
        window.location.replace(target.href);
    </script>
</body>
</html>
