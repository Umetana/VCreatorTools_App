<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VCreatorTools</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>VCreatorTools</h1><p>Electron App <span id="version"></span></p></div><span id="badge">確認中</span></header>
<section class="card"><h2>Local Server</h2><dl id="status"></dl><div class="actions"><button id="start">起動</button><button id="stop">停止</button><button id="home">トップページ</button><button id="admin">管理画面</button></div></section>
<section class="card"><h2>接続設定</h2><form id="settings"><div class="field"><label>Main</label><span class="fixed">127.0.0.1（このPCのみ）</span><input id="main-port" type="number" min="1024" max="65535" required aria-label="Main Port"></div><div class="field"><label><input id="remote-enabled" type="checkbox"> Remoteを有効にする</label><span class="fixed">家庭内LANから接続</span><input id="remote-port" type="number" min="1024" max="65535" required aria-label="Remote Port"></div><p class="note">保存するとServerを再起動します。MainとRemoteには別のPortを指定してください。</p><div class="actions"><button type="submit">設定を保存して再起動</button><span id="settings-result"></span></div></form></section>
<section class="card"><h2>フォルダー</h2><div class="actions"><button data-path="userData">ユーザーデータ</button><button data-path="logsDir">ログ</button><button data-path="userGadgetsDir">ユーザーガジェット</button></div></section>
<section class="card"><h2>ログ</h2><pre id="log"></pre></section></main><script src="app.js"></script></body></html>
