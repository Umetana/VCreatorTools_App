<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{font:13px system-ui;color:#ddd;background:#2d2d2d;margin:12px}label{display:block;margin:10px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:7px;background:#444;color:#fff;border:1px solid #666;border-radius:4px}button{margin-top:8px}.note{color:#aaa;font-size:11px}#status{margin-top:8px}</style></head><body>
<label>Automation Token</label><input id="token" type="password" autocomplete="off"><button id="save-token">Tokenを保存</button><p class="note">VCreatorTools Appの「Tokenをコピー」から貼り付けます。</p>
<div id="counter-fields" hidden><label>Counter</label><select id="counter-id"></select><label>操作</label><select id="operation"><option value="increment">加算</option><option value="decrement">減算</option><option value="reset">リセット</option><option value="set">指定値</option></select><label>増減幅／指定値</label><input id="amount" type="number" min="0" value="1"></div>
<div id="effect-fields" hidden><label>Effect</label><select id="button-id"></select></div><div id="status" class="note">接続待機中</div>
<script>
let ws,uuid,context,action,settings={};const $=id=>document.getElementById(id);function send(event,payload={}){ws.send(JSON.stringify({event,context,payload}))}function requestCatalog(){ws.send(JSON.stringify({event:'sendToPlugin',action,context,payload:{type:'catalog'}}))}function save(){send('setSettings',settings)}
window.connectElgatoStreamDeckSocket=(port,inUuid,registerEvent,info,actionInfo)=>{const parsedActionInfo=JSON.parse(actionInfo);uuid=inUuid;context=inUuid;action=parsedActionInfo.action;settings=parsedActionInfo.payload.settings||{};ws=new WebSocket(`ws://127.0.0.1:${port}`);ws.onopen=()=>{ws.send(JSON.stringify({event:registerEvent,uuid}));send('getGlobalSettings');render();};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==='didReceiveGlobalSettings'){const token=m.payload.settings.automationToken||'';$('token').value=token;if(token){$('status').textContent='接続確認中…';requestCatalog()}}if(m.event==='sendToPropertyInspector'){if(m.payload.type==='catalog'){fill(m.payload)}else $('status').textContent='VCreatorToolsへ接続できません';}}};
function render(){const counter=action.endsWith('.counter');$('counter-fields').hidden=!counter;$('effect-fields').hidden=counter;$('operation').value=settings.operation||'increment';$('amount').value=settings.amount??1;}
function fill(p){let changed=false;if(p.counters){$('counter-id').replaceChildren(...p.counters.map(x=>new Option(`${x.id} — ${x.label}`,x.id)));settings.counterId=settings.counterId||p.counters[0]?.id||'';settings.operation=settings.operation||'increment';settings.amount=settings.amount??1;$('counter-id').value=settings.counterId;changed=true}if(p.effects){$('button-id').replaceChildren(...p.effects.map(x=>new Option(x.label,x.buttonId)));settings.buttonId=settings.buttonId||p.effects[0]?.buttonId||'';$('button-id').value=settings.buttonId;changed=true}if(changed)save();$('status').textContent='接続済み'}
$('save-token').onclick=()=>{ws.send(JSON.stringify({event:'setGlobalSettings',context:uuid,payload:{automationToken:$('token').value.trim()}}));$('status').textContent='接続確認中…';setTimeout(requestCatalog,250)};$('counter-id').onchange=e=>{settings.counterId=e.target.value;save()};$('operation').onchange=e=>{settings.operation=e.target.value;save()};$('amount').onchange=e=>{settings.amount=Number(e.target.value);save()};$('button-id').onchange=e=>{settings.buttonId=e.target.value;save()};
</script></body></html>
